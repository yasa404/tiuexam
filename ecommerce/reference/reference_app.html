<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT 355 Midterm Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: a calm study tool in cool slate + one "checkout orange" accent (e-commerce nod).
   Bold moment = the results receipt. Everything else stays quiet. Single 760px column. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --sunk:#f5f7fb; --ink:#0f1729; --muted:#5a6478; --line:#d8deea;
  --accent:#ff5a1f; --accent-ink:#ffffff; --accent-soft:#fff0e9; --navy:#14254a;
  --good:#0d7f57; --good-bg:#e3f4ec; --bad:#c42f3c; --bad-bg:#fbe9eb; --part:#a86f00; --part-bg:#fdf3d8;
  --l1:#2559d9; --l2:#7a3bd6; --l3:#0b857a; --l4:#cf2a72;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r:14px; --shadow:0 1px 2px rgba(15,23,41,.06), 0 8px 24px -12px rgba(15,23,41,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c111b; --surface:#151c29; --sunk:#111723; --ink:#e9eef7; --muted:#9aa6bd; --line:#273145;
  --accent:#ff7038; --accent-ink:#1a0c05; --accent-soft:#2c1a12; --navy:#dfe7f7;
  --good:#3ccf95; --good-bg:#0f2a21; --bad:#ff6b77; --bad-bg:#33161b; --part:#f2bd4b; --part-bg:#2e2410;
  --l1:#7ea3ff; --l2:#b993ff; --l3:#4fd1c2; --l4:#ff7fb3; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7); color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0c111b; --surface:#151c29; --sunk:#111723; --ink:#e9eef7; --muted:#9aa6bd; --line:#273145;
  --accent:#ff7038; --accent-ink:#1a0c05; --accent-soft:#2c1a12; --navy:#dfe7f7;
  --good:#3ccf95; --good-bg:#0f2a21; --bad:#ff6b77; --bad-bg:#33161b; --part:#f2bd4b; --part-bg:#2e2410;
  --l1:#7ea3ff; --l2:#b993ff; --l3:#4fd1c2; --l4:#ff7fb3; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7); color-scheme: dark; }

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:780px;margin:0 auto;padding:0 18px 64px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.sub{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.foot{color:var(--muted);font-size:.85rem;margin-top:22px}
.center{text-align:center}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.link:hover{color:var(--ink)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{font-family:var(--mono);font-weight:700;font-size:.8rem;background:var(--navy);color:var(--bg);padding:6px 7px;border-radius:8px;letter-spacing:.5px}
.brand b{display:block;font-family:var(--display);font-size:1.05rem;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:999px}
.tab{border:0;background:none;padding:7px 14px;border-radius:999px;font-size:.88rem;font-weight:600;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg)}

/* hero */
.hero{padding:26px 0 8px}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.hero h1{font-size:clamp(2rem,6vw,3.1rem);font-weight:800;line-height:1.02;letter-spacing:-.02em}
.hero h1 span{color:var(--accent)}
.lede{color:var(--muted);max-width:60ch;margin:12px 0 0;font-size:1.02rem}
.h1s{font-size:2rem;font-weight:800;letter-spacing:-.01em;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 0}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats dt{font-size:.74rem;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--mono);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.weak{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:14px 16px;border-radius:var(--r);background:var(--part-bg);border:1px solid color-mix(in srgb,var(--part) 35%,transparent);flex-wrap:wrap}
.weak b{display:block}.weak span{font-size:.88rem;color:var(--muted)}
.sec{font-size:1.15rem;font-weight:700;margin:30px 0 12px}

/* presets */
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.preset{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.preset:hover{transform:translateY(-2px);border-color:var(--ink)}
.preset .pn{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;letter-spacing:-.03em}
.preset b{font-size:1.02rem;margin-top:6px}
.preset span:last-child{font-size:.84rem;color:var(--muted)}
.preset.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.preset.accent span:last-child{color:inherit;opacity:.85}

/* custom */
.custom{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 16px}
.custom summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between}
.custom summary::after{content:'+';font-family:var(--mono);color:var(--muted)}
.custom[open] summary::after{content:'–'}
.custom[open]{padding-bottom:16px}
.field{margin:6px 0 16px}
.fl{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.center{justify-content:center}
.chip{border:1px solid var(--line);background:var(--sunk);padding:7px 12px;border-radius:999px;font-size:.88rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--mono);font-size:.8rem;margin-right:2px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:7px;font-weight:600;font-family:var(--mono)}
.seg button.on{background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.seg.wide{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg.wide button{font-family:var(--body);text-align:left;padding:10px 12px}
.seg.wide small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.seg.small button{padding:5px 12px;font-size:.8rem}

/* buttons */
.btn{border:1px solid transparent;border-radius:11px;padding:10px 16px;font-weight:600;font-size:.95rem;transition:filter .15s,transform .1s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.good{background:var(--good);color:#fff}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.4}
.btn.big{width:100%;padding:14px;font-size:1.02rem;margin-top:4px}

/* quiz */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 10px}
.qcount{font-family:var(--mono);color:var(--muted)}
.qcount b{color:var(--ink);font-size:1.2rem}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:8px;min-width:72px;text-align:center}
.timer.exam{color:var(--ink);font-weight:700}
.timer.low{color:var(--bad);border-color:var(--bad)}
.segs{display:flex;gap:3px;margin-bottom:16px}
.sg{flex:1;height:7px;border:0;padding:0;border-radius:3px;background:var(--line)}
.sg.done{background:var(--navy);opacity:.55}
.sg.good{background:var(--good)}.sg.bad{background:var(--bad)}.sg.part{background:var(--part)}
.sg.cur{background:var(--accent);opacity:1}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;box-shadow:var(--shadow);border-top:5px solid var(--line)}
.qcard.is-good{border-top-color:var(--good)}.qcard.is-bad{border-top-color:var(--bad)}.qcard.is-part{border-top-color:var(--part)}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-family:var(--mono);font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.l1{color:var(--l1);border-color:color-mix(in srgb,var(--l1) 35%,transparent)}
.tag.l2{color:var(--l2);border-color:color-mix(in srgb,var(--l2) 35%,transparent)}
.tag.l3{color:var(--l3);border-color:color-mix(in srgb,var(--l3) 35%,transparent)}
.tag.l4{color:var(--l4);border-color:color-mix(in srgb,var(--l4) 35%,transparent)}
.tag.type{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qtext{font-size:clamp(1.18rem,3.4vw,1.42rem);font-weight:700;line-height:1.38;letter-spacing:-.005em;margin-bottom:18px}
.opts{display:grid;gap:9px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--sunk);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:.85rem;background:var(--surface);border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.good .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
input.good,select.good{border-color:var(--good);background:var(--good-bg)} input.bad{border-color:var(--bad);background:var(--bad-bg)}
input.blank{background:color-mix(in srgb,var(--accent) 7%,transparent);font-family:var(--body);font-weight:600;font-size:1em;padding:2px 8px;margin:2px 2px;border-width:0 0 2.5px 0;border-radius:6px 6px 0 0;border-color:var(--ink);max-width:100%}
input.blank:focus{border-color:var(--accent)}
.fix{display:inline-block;font-size:.8em;font-weight:600;color:var(--good);background:var(--good-bg);padding:1px 7px;border-radius:6px;margin:0 4px}
.listin{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:li}
.listin li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;counter-increment:li}
.listin li::before{content:counter(li);font-family:var(--mono);font-size:.8rem;color:var(--muted);width:20px;text-align:right}
.listin input{flex:1;min-width:180px}
.listin input.empty{opacity:.5}
.ok{font-size:.8rem;color:var(--good);font-weight:600}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(110px,28%) 1fr;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.mrow.good{border-color:var(--good);background:var(--good-bg)} .mrow.bad{border-color:var(--bad);background:var(--bad-bg)}
.ml{font-weight:700;font-size:.95rem}
.mrow select{width:100%;min-width:0;background:var(--surface)}
.mrow .fix{grid-column:2}
textarea{width:100%;resize:vertical;line-height:1.5}
.fb{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.verdict{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.25rem;margin-bottom:6px}
.verdict .dot{width:12px;height:12px;border-radius:50%;background:var(--muted)}
.is-good .verdict{color:var(--good)} .is-good .dot{background:var(--good)}
.is-bad .verdict{color:var(--bad)} .is-bad .dot{background:var(--bad)}
.is-part .verdict{color:var(--part)} .is-part .dot{background:var(--part)}
.fb p{margin:6px 0}
.tip{background:var(--sunk);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.93rem}
.full{margin:6px 0;padding-left:20px} .full li{color:var(--muted)} .full li.got{color:var(--good);font-weight:600}
.pts{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.pt{width:100%;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:.92rem;color:var(--muted)}
.pt.got{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:var(--good-bg);font-weight:600}
.model{margin-top:10px;background:var(--sunk);border-radius:10px;padding:8px 12px}
.model summary{cursor:pointer;font-weight:700;font-size:.9rem}
.model p{font-size:.93rem}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.qnav .right,.dlg .right,.ractions{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.8rem;color:var(--muted);font-family:var(--mono)}

/* results receipt: the one loud moment */
.res{display:grid;grid-template-columns:minmax(0,370px) 1fr;gap:26px;align-items:start;margin-top:12px}
.receipt{position:relative;background:#fffefb;color:#1b1b1b;font-family:var(--mono);font-size:.84rem;padding:22px 20px 26px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);
  -webkit-mask:radial-gradient(circle 7px at 50% 0,transparent 98%,#000) 0 0/16px 51% repeat-x,radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 100%/16px 51% repeat-x;
  mask:radial-gradient(circle 7px at 50% 0,transparent 98%,#000) 0 0/16px 51% repeat-x,radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 100%/16px 51% repeat-x;
  animation:print .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes print{from{transform:translateY(-14px);clip-path:inset(0 0 100% 0)}to{transform:none;clip-path:inset(0 0 0 0)}}
.rh{text-align:center;display:grid;gap:2px;padding-bottom:12px;border-bottom:1.5px dashed #b9b4a8}
.rh b{font-size:.95rem;letter-spacing:.08em}
.rh span{font-size:.74rem;color:#6b665c}
.rsec{padding:10px 0;border-bottom:1.5px dashed #b9b4a8;display:grid;gap:4px}
.rsec.small{font-size:.76rem;color:#55524a}
.rl{display:flex;align-items:baseline;gap:6px}
.rl i{flex:1;border-bottom:1.5px dotted #c9c3b6;transform:translateY(-3px)}
.rtotal{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px;gap:12px}
.rtotal span{display:block;letter-spacing:.12em;font-size:.78rem;color:#6b665c}
.rtotal b{display:block;line-height:1;margin-top:4px;font-size:3rem;font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.stamp{flex:none;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2.4rem;border:4px solid currentColor;transform:rotate(-14deg);opacity:.85;animation:stamp .35s .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:.85}}
.stamp.gA,.stamp.gB{color:#0d7f57}.stamp.gC{color:#b07400}.stamp.gD,.stamp.gF{color:#c42f3c}
.rmsg{margin:10px 0 0;font-family:var(--body);font-size:.92rem}
.ractions{flex-direction:column;align-items:stretch}
.revhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:34px;flex-wrap:wrap}
.revhead .sec{margin:0}
.rev{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;margin-top:8px}
.rev.good{border-left-color:var(--good)}.rev.bad{border-left-color:var(--bad)}.rev.part{border-left-color:var(--part)}
.rev summary{display:flex;gap:12px;align-items:baseline;padding:12px 14px;cursor:pointer;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rn{font-family:var(--mono);color:var(--muted);font-size:.8rem;width:22px;flex:none}
.rq{flex:1;font-weight:600}
.rs{font-family:var(--mono);font-size:.82rem;font-weight:700}
.rev.good .rs{color:var(--good)}.rev.bad .rs{color:var(--bad)}.rev.part .rs{color:var(--part)}
.rb{padding:0 14px 12px 48px}
.rb p{margin:6px 0}
.lab{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center}

/* flashcards */
.chead{text-align:center}.chead .lede{margin:8px auto 18px}
.fcwrap{perspective:1400px;margin:20px auto 14px;max-width:560px}
.fc{position:relative;width:100%;min-height:290px;border:0;padding:0;background:none;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px;text-align:center}
.face.front b{font-family:var(--display);font-size:clamp(1.5rem,5vw,2.1rem);font-weight:800;line-height:1.1;letter-spacing:-.01em}
.face small{color:var(--muted);font-size:.8rem}
.face.back{transform:rotateY(180deg);background:var(--navy);color:var(--bg);border-color:var(--navy)}
.face.back .tag{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.face .ans{font-size:1.04rem;line-height:1.55;max-width:46ch}
.fcbar{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px}

/* progress */
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 28px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 25%;background-origin:content-box}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;max-width:46px}
.bar i{width:100%;border-radius:6px 6px 2px 2px;background:var(--muted)}
.bar i.good{background:var(--good)}.bar i.part{background:var(--part)}.bar i.bad{background:var(--bad)}
.bar span{position:absolute;bottom:-22px;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.lacc{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.la{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr 48px;gap:12px;align-items:center;font-size:.9rem}
.la b{font-family:var(--mono)}
.track{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;background:var(--muted)}
.track i.good{background:var(--good)}.track i.part{background:var(--part)}.track i.bad{background:var(--bad)}
.mlist{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.mlist li{display:flex;gap:10px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.92rem}
.mlist li .mono{margin-left:auto}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.5);display:grid;place-items:center;padding:18px;z-index:10}
.dlg{background:var(--surface);border-radius:16px;padding:20px;max-width:400px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.dlg h3{font-size:1.2rem;margin-bottom:6px}.dlg p{color:var(--muted);margin:0 0 16px}.dlg .right{justify-content:flex-end}

@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .presets{grid-template-columns:1fr}
  .preset{flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:12px}
  .preset .pn{font-size:1.9rem}
  .preset span:last-child{flex-basis:100%}
  .res{grid-template-columns:1fr}
  .qcard{padding:18px 16px}
  .mrow{grid-template-columns:1fr}
  .mrow .fix{grid-column:1}
  .la{grid-template-columns:1fr 48px}.la .track{grid-column:1/-1;grid-row:2}
  .rb{padding-left:14px}
  .tabs{width:100%;justify-content:space-between}
  .tab{flex:1;padding:7px 6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* IT 355 E-Commerce question bank: Lectures 1-4 (Dr. Hala Najwan Sabeh's slides, Laudon & Traver).
   Types: mcq (o[0] is correct), tf, fill ({{n}} blanks), list (n of items), match (pool of pairs), exp (key points). */
const BANK = [
/* ===================== LECTURE 1 ===================== */
{id:'1m1',l:1,t:'mcq',q:'E-commerce is the use of the Internet, Web and mobile apps to digitally enable commercial transactions between and among…',o:['organizations and individuals','only large businesses','government agencies only','employees inside one firm'],e:'Definition: "…between and among organizations and individuals."'},
{id:'1m2',l:1,t:'mcq',q:'Commercial transactions involve the exchange of ___ across an organizational boundary in exchange for goods and services.',o:['money','information only','employees','software code'],e:'Commercial transactions = the exchange of money across organizational boundaries for goods and services.'},
{id:'1m3',l:1,t:'mcq',q:'Which of these is an example of e-business rather than e-commerce?',o:['Online inventory control','A customer buying shoes on a website','Selling a used phone on eBay','Paying for a Spotify subscription'],e:'E-business = digital technology applied to processes inside the firm. The slide example is online inventory control.'},
{id:'1m4',l:1,t:'mcq',q:'E-commerce primarily involves transactions that…',o:['cross firm boundaries','stay inside the firm','never involve money','happen face-to-face'],e:'E-commerce crosses firm boundaries; e-business stays within the firm.'},
{id:'1m5',l:1,t:'mcq',q:'Which is the best definition of the Internet?',o:['A worldwide network of computer networks built on common standards','A collection of web pages written in HTML','A social media platform for sharing content','A wireless cell-phone network'],e:'The Internet is a worldwide network of computer networks built on common standards. The Web is only one service on it.'},
{id:'1m6',l:1,t:'mcq',q:'Web pages are created in a language called…',o:['HTML','SQL','Java','TCP/IP'],e:'HTML = HyperText Markup Language.'},
{id:'1m7',l:1,t:'mcq',q:'According to the slides, the growth of the Internet can be measured by…',o:['the number of Internet hosts with domain names','the number of smartphones sold','the number of HTML pages','the number of e-mail users'],e:'Slide: "The Internet can measure growth by number of Internet hosts with domain names."'},
{id:'1m8',l:1,t:'mcq',q:'Which is NOT a feature of Web 2.0?',o:['Mostly static HTML pages','User-generated content and communication','Highly interactive, social communities','Large audiences'],e:'Static HTML pages describe Web 1.0.'},
{id:'1m9',l:1,t:'mcq',q:'Which of these is an example of Web 2.0?',o:['Wikipedia','A printed product catalogue','A static company brochure page','A radio advertisement'],e:'Web 2.0 examples from the slides: Twitter (X), YouTube, Instagram, Wikipedia.'},
{id:'1m10',l:1,t:'mcq',q:'The most recent development in Internet infrastructure is…',o:['the mobile platform','the World Wide Web','e-mail','file transfer'],e:'The mobile platform is the most recent development. It gives Internet access via wireless networks or cell-phone service.'},
{id:'1m11',l:1,t:'mcq',q:'In e-commerce, the interaction between the business and the consumer is…',o:['screen-to-face','face-to-face','door-to-door','phone-to-phone'],e:'Traditional = face-to-face. E-commerce = screen-to-face.'},
{id:'1m12',l:1,t:'mcq',q:'Which factor favours TRADITIONAL commerce over e-commerce?',o:['Physical inspection','Time accessibility','Cost effective','Geographical accessibility'],e:'In e-commerce you can\'t touch the goods; you rely on electronic images. Fraud is the other factor where traditional commerce is better.'},
{id:'1m13',l:1,t:'mcq',q:'Why is e-commerce more cost effective than traditional commerce?',o:['The cost of middlemen is eliminated by a direct link to the customer','Products are always free to deliver','There are no taxes online','Websites cost nothing to run'],e:'The cost of middlemen is removed because the business links directly with the customer.'},
{id:'1m14',l:1,t:'mcq',q:'When introducing a new product, e-commerce allows a company to…',o:['get immediate customer feedback on the website','skip pricing decisions','avoid any competition','sell without a product'],e:'Traditional commerce needs costly pilot surveys; online you get immediate feedback and can modify the product.'},
{id:'1m15',l:1,t:'mcq',q:'"Round the clock (24 × 7) service" describes which factor?',o:['Time accessibility','Time saving','Convenience','Profit'],e:'Time accessibility: traditional shops open for limited hours; e-commerce is 24×7.'},
{id:'1m16',l:1,t:'mcq',q:'Why do more frauds take place in e-commerce transactions?',o:['Lack of physical presence and unclear legal issues','Because prices are lower online','Because of face-to-face interaction','Because shops close at night'],e:'People fear giving card details; lack of physical presence and unclear legal issues create loopholes.'},
{id:'1m17',l:1,t:'mcq',q:'Why study e-commerce, according to Lecture 1?',o:['Its technology is more powerful than previous technologies and it brings fundamental changes to commerce','It replaced the Internet','It is only used by large companies','It removes the need for marketing'],e:'Two reasons: different and more powerful technology, and fundamental changes to commerce.'},
{id:'1m18',l:1,t:'mcq',q:'Which statement about the Web is correct?',o:['It is one of the most popular services that runs on the Internet','It is the same thing as the Internet','It was replaced by Web 2.0 and no longer exists','It is a type of mobile device'],e:'The Web is a service on the Internet infrastructure that provides access to Web pages.'},
{id:'1t1',l:1,t:'tf',q:'The Web and the Internet are the same thing.',a:false,e:'False. The Web is one service that runs on the Internet.'},
{id:'1t2',l:1,t:'tf',q:'With Web 1.0, most websites consisted of static HTML pages.',a:true,e:'True. Web 2.0 brought user-generated, interactive content.'},
{id:'1t3',l:1,t:'tf',q:'E-business primarily involves the application of digital technologies to business processes within the firm.',a:true,e:'True. Example: online inventory control.'},
{id:'1t4',l:1,t:'tf',q:'In e-commerce, customers can physically inspect goods before buying them.',a:false,e:'False. They must rely on electronic images.'},
{id:'1t5',l:1,t:'tf',q:'Fraud is comparatively less in traditional commerce because there is personal interaction between buyer and seller.',a:true,e:'True.'},
{id:'1t6',l:1,t:'tf',q:'It is easier to expand from a regional to an international market in traditional commerce than in e-commerce.',a:false,e:'False. In e-commerce you host a website, advertise online, meet legal norms, and you can reach the global market.'},
{id:'1t7',l:1,t:'tf',q:'Services of the Internet include the Web, e-mail and file transfers.',a:true,e:'True.'},
{id:'1t8',l:1,t:'tf',q:'E-commerce increases profit by increasing sales, cutting cost and streamlining operating processes.',a:true,e:'True. In traditional commerce, middlemen, overhead and inventory costs pull profit down.'},
{id:'1f1',l:1,t:'fill',q:'{{0}} is the use of Internet, Web and mobile apps to digitally enable commercial transactions between and among {{1}} and {{2}}.',b:[['e-commerce','ecommerce','electronic commerce','ec'],['organizations','organisations','organization'],['individuals','individual','people','consumers']],set:[1,2],e:'E-commerce … between and among organizations and individuals.'},
{id:'1f2',l:1,t:'fill',q:'{{0}} primarily involves transactions that cross firm boundaries.',b:[['e-commerce','ecommerce','electronic commerce']],e:'E-commerce crosses firm boundaries.'},
{id:'1f3',l:1,t:'fill',q:'{{0}} primarily involves the application of digital technologies to business processes within the firm.',b:[['e-business','ebusiness','electronic business']],e:'E-business stays inside the firm.'},
{id:'1f4',l:1,t:'fill',q:'The {{0}} is the worldwide network of computer networks built on common standards.',b:[['internet']],e:'The Internet.'},
{id:'1f5',l:1,t:'fill',q:'The {{0}} enables access to the Internet via wireless networks or cell-phone service.',b:[['mobile platform','mobile']],e:'The mobile platform.'},
{id:'1f6',l:1,t:'fill',q:'The {{0}} provides access to Web pages.',b:[['web','world wide web','www']],e:'The World Wide Web (the Web).'},
{id:'1f7',l:1,t:'fill',q:'In traditional commerce the interaction is "face-to-face"; in e-commerce it is "{{0}}".',b:[['screen-to-face','screen to face']],e:'Screen-to-face.'},
{id:'1f8',l:1,t:'fill',q:'Web pages are created in a language called {{0}}.',b:[['html','hypertext markup language']],e:'HTML: HyperText Markup Language.'},
{id:'1l1',l:1,t:'list',q:'List ten factors that can be used to differentiate between e-commerce and traditional commerce.',n:10,items:[
  {s:'Cost effective',k:['cost']},{s:'Time saving',k:['time saving','saving time','saves time','time save']},{s:'Convenience',k:['convenien']},
  {s:'Geographical accessibility',k:['geograph','geographic']},{s:'Introduction of new products',k:['new product','introduction']},{s:'Profit',k:['profit']},
  {s:'Physical inspection',k:['physical','inspect']},{s:'Time accessibility',k:['time accessib','24x7','24/7','24 7','access time']},{s:'Customer interaction',k:['interaction','interact']},{s:'Fraud',k:['fraud']}],e:'Cats Take Cool Green Naps · Pink Pandas Talk Calmly Fridays.'},
{id:'1l2',l:1,t:'list',q:'List the three features of Web 2.0.',n:3,items:[{s:'User-generated content and communication',k:['user generated','user-generated','generated content','user content']},{s:'Highly interactive, social communities',k:['interactive','communit']},{s:'Large audiences',k:['audience']}],e:'From the Web 2.0 slide.'},
{id:'1l3',l:1,t:'list',q:'Give three examples of Web 2.0 technologies.',n:3,items:[{s:'Twitter (X)',k:['twitter','=x']},{s:'YouTube',k:['youtube']},{s:'Instagram',k:['instagram']},{s:'Wikipedia',k:['wikipedia']}],e:'Slide examples: Twitter (X), YouTube, Instagram, Wikipedia.'},
{id:'1l4',l:1,t:'list',q:'List the two reasons for studying e-commerce.',n:2,items:[{s:'E-commerce technology is different and more powerful than previous technologies',k:['powerful','different','technolog']},{s:'E-commerce brings fundamental changes to commerce',k:['fundamental','change']}],e:'From the "Why study e-commerce?" slide.'},
{id:'1x1',l:1,t:'exp',q:'Define e-commerce and describe how it differs from e-business.',pts:[{p:'Uses the Internet, Web and mobile apps',k:['internet','web','mobile']},{p:'Digitally enabled commercial transactions (exchange of money for goods/services)',k:['transaction','money','commercial']},{p:'Between and among organizations and individuals',k:['organization','organisation','individual']},{p:'E-commerce crosses firm boundaries',k:['boundar','cross','outside']},{p:'E-business = digital technology for processes within the firm (e.g. online inventory control)',k:['within','inside','internal','inventory']}],m:'E-commerce is the use of the Internet, Web and mobile apps to digitally enable commercial transactions between and among organizations and individuals. It involves transactions that cross firm boundaries. E-business is the application of digital technologies to business processes within the firm, using information systems under the firm\'s control (e.g. online inventory control).'},
{id:'1x2',l:1,t:'exp',q:'Explain these three factors that differentiate e-commerce from traditional commerce: cost effective, time accessibility, and physical inspection.',pts:[{p:'Cost: traditional pays middlemen; e-commerce eliminates them (direct link to customer)',k:['middlem','direct']},{p:'Time accessibility: traditional open limited hours; e-commerce 24×7',k:['24','limited','round the clock','hours']},{p:'Physical inspection: traditional allows it; e-commerce relies on electronic images',k:['image','inspect','touch','physical']}],m:'Cost effective: in traditional commerce cost is incurred for middlemen; in e-commerce this is eliminated by a direct link between business and customer. Time accessibility: traditional businesses open for a limited time; e-commerce offers round-the-clock 24×7 service. Physical inspection: in traditional commerce goods can be inspected before purchase; in e-commerce customers rely on electronic images.'},
{id:'1x3',l:1,t:'exp',q:'Explain Web 2.0 technologies and give three examples.',pts:[{p:'User-centered applications and social media technologies',k:['user centered','user-centered','social media','user centred']},{p:'Let people collaborate and share information online',k:['collaborat','share','sharing']},{p:'Features: user-generated content, interactive communities, large audiences',k:['generated','interactive','audience','communit']},{p:'Examples: Twitter (X), YouTube, Instagram, Wikipedia',k:['youtube','instagram','wikipedia','twitter']}],m:'Web 2.0 refers to user-centered applications and social media technologies: a new generation of websites that let people collaborate and share information online in ways not possible before (Web 1.0 was mostly static HTML pages). Features: user-generated content and communication, highly interactive social communities, large audiences. Examples: YouTube, Instagram, Wikipedia (also Twitter/X).'},
{id:'1p1',l:1,t:'match',q:'Match each term with its definition.',n:4,pairs:[['The Internet','Worldwide network of computer networks built on common standards'],['The Web','Service on the Internet that provides access to Web pages'],['Mobile platform','Access to the Internet via wireless networks or cell-phone service'],['Web 2.0','User-centered applications and social media technologies'],['E-business','Digital technologies applied to business processes within the firm'],['HTML','Language used to create Web pages']],e:'Lecture 1 building blocks.'},
{id:'1p2',l:1,t:'match',q:'Match each factor with what e-commerce offers.',n:4,pairs:[['Time accessibility','Round the clock (24 × 7) service'],['Customer interaction','Screen-to-face'],['Cost effective','No middlemen: direct link to the customer'],['Physical inspection','Customers rely on electronic images'],['Introduction of new products','Immediate customer feedback'],['Geographical accessibility','Easy to reach international markets']],e:'From the 10 factors.'},

/* ===================== LECTURE 2 ===================== */
{id:'2m1',l:2,t:'mcq',q:'Which is NOT one of the eight unique features of e-commerce technology?',o:['Physical inspection','Ubiquity','Information density','Social technology'],e:'The 8: ubiquity, global reach, universal standards, information richness, interactivity, information density, personalization/customization, social technology.'},
{id:'2m2',l:2,t:'mcq',q:'"Available just about everywhere, at all times" describes…',o:['Ubiquity','Global reach','Interactivity','Universal standards'],e:'Ubiquity: you can shop from your desktop, at home, at work, or even from your car.'},
{id:'2m3',l:2,t:'mcq',q:'A marketplace extended beyond traditional boundaries and removed from a temporal and geographic location is called a…',o:['marketspace','marketplace','market segment','portal'],e:'Ubiquity creates a marketspace.'},
{id:'2m4',l:2,t:'mcq',q:'Because of global reach, the potential market size for e-commerce merchants is roughly equal to…',o:['the size of the world\'s online population','the population of the merchant\'s city','the number of physical stores','the number of websites'],e:'Global reach: the market ≈ the world\'s online population.'},
{id:'2m5',l:2,t:'mcq',q:'Technical standards that are shared by all nations around the world describe…',o:['Universal standards','Global reach','Information density','Richness'],e:'Traditional commerce technologies differ from one nation to the next.'},
{id:'2m6',l:2,t:'mcq',q:'Information richness refers to…',o:['the complexity and content of a message','the total amount of information available to all participants','two-way communication','many-to-many communication'],e:'Richness = complexity and content of a message.'},
{id:'2m7',l:2,t:'mcq',q:'Search boxes that autofill as the user types are an example of…',o:['Interactivity','Ubiquity','Universal standards','Global reach'],e:'Interactivity examples: comments, forums, like/share buttons, forms that flag problems, autofill search.'},
{id:'2m8',l:2,t:'mcq',q:'Information density is…',o:['the total amount and quality of information available to all market participants','the complexity and content of a single message','the number of websites per country','the speed of an Internet connection'],e:'E-commerce vastly increases information density.'},
{id:'2m9',l:2,t:'mcq',q:'Price transparency refers to…',o:['the ease with which consumers can find out the variety of prices in a market','consumers discovering the actual costs merchants pay','selling the same goods at different prices','hiding prices from competitors'],e:'Price transparency: easy to see all prices.'},
{id:'2m10',l:2,t:'mcq',q:'Cost transparency refers to…',o:['the ability of consumers to discover the actual costs merchants pay for products','the ease of comparing prices in a market','charging different groups different prices','the cost of building a website'],e:'Cost transparency: consumers can see what merchants pay.'},
{id:'2m11',l:2,t:'mcq',q:'Coupons, age discounts and loyalty programs are examples of…',o:['price discrimination','price transparency','cost transparency','customization'],e:'Price discrimination: different prices for the same product based on what each customer will agree to pay.'},
{id:'2m12',l:2,t:'mcq',q:'Airline tickets bought months in advance are cheaper than last-minute tickets. This illustrates…',o:['price discrimination','ubiquity','information richness','social technology'],e:'The airline industry is the main slide example of price discrimination.'},
{id:'2m13',l:2,t:'mcq',q:'Targeting marketing messages by adjusting them to a person\'s name, interests and past purchases is…',o:['personalization','customization','interactivity','social technology'],e:'Personalization changes the MESSAGE.'},
{id:'2m14',l:2,t:'mcq',q:'Changing the delivered product or service based on a user\'s preferences or prior behaviour is…',o:['customization','personalization','price discrimination','richness'],e:'Customization changes the PRODUCT (e.g. a custom T-shirt).'},
{id:'2m15',l:2,t:'mcq',q:'Showing "customers also buy" recommendations after a purchase is an example of…',o:['personalization','customization','universal standards','global reach'],e:'Personalized product recommendations.'},
{id:'2m16',l:2,t:'mcq',q:'Social technology provides a ___ model of mass communications.',o:['many-to-many','one-to-many','one-to-one','many-to-one'],e:'Millions of users generate content consumed by millions of others.'},
{id:'2m17',l:2,t:'mcq',q:'Which feature makes the consumer a "co-participant" in the process of delivering goods to the market?',o:['Interactivity','Ubiquity','Universal standards','Information density'],e:'Business significance of interactivity.'},
{id:'2m18',l:2,t:'mcq',q:'"A common, inexpensive, global technology foundation for businesses to use" is the business significance of…',o:['Universal standards','Global reach','Social technology','Richness'],e:'From Table 1.2.'},
{id:'2m19',l:2,t:'mcq',q:'"Information becomes plentiful, cheap, and accurate" is the business significance of…',o:['Information density','Information richness','Interactivity','Ubiquity'],e:'From Table 1.2.'},
{id:'2m20',l:2,t:'mcq',q:'Which industries are named on the slides as using price discrimination?',o:['Airline and arts/entertainment','Agriculture and mining','Banking and insurance','Construction and energy'],e:'Airline industry and arts/entertainment industry.'},
{id:'2m21',l:2,t:'mcq',q:'The richness enabled by e-commerce allows merchants to market and sell…',o:['"complex" goods and services','only simple goods','only digital downloads','only local services'],e:'Richness lets merchants sell complex goods and services.'},
{id:'2m22',l:2,t:'mcq',q:'Customized T-shirts, bags, carpets and tables are slide examples of…',o:['customization','personalization','ubiquity','price transparency'],e:'Customization: the product itself changes.'},
{id:'2t1',l:2,t:'tf',q:'In traditional commerce, a marketplace is a physical place you visit in order to transact.',a:true,e:'True. E-commerce creates a marketspace instead.'},
{id:'2t2',l:2,t:'tf',q:'Most traditional commerce is local or regional.',a:true,e:'True. It involves local merchants or national merchants with local outlets.'},
{id:'2t3',l:2,t:'tf',q:'Traditional commerce technologies are the same in every nation.',a:false,e:'False. They differ from one nation to the next. Internet standards are universal.'},
{id:'2t4',l:2,t:'tf',q:'E-commerce can offer more information richness than TV and radio because it is interactive and can adjust the message to individual users.',a:true,e:'True.'},
{id:'2t5',l:2,t:'tf',q:'Customization means adjusting the marketing message to a person\'s name.',a:false,e:'False. That is personalization. Customization changes the product.'},
{id:'2t6',l:2,t:'tf',q:'Flights home late on Sunday tend to be cheaper than flights leaving early Sunday morning.',a:false,e:'False. Late-Sunday flights are more expensive because many passengers prefer them.'},
{id:'2t7',l:2,t:'tf',q:'Information density reduces information costs and raises quality.',a:true,e:'True.'},
{id:'2t8',l:2,t:'tf',q:'Traditional retail stores have great information richness because they offer personal, face-to-face service.',a:true,e:'True. E-commerce can come close (e.g. chatting with an online salesperson).'},
{id:'2f1',l:2,t:'fill',q:'Information {{0}} is the total amount and quality of information available to all market participants.',b:[['density']],e:'Information density.'},
{id:'2f2',l:2,t:'fill',q:'Information {{0}} refers to the complexity and content of a message.',b:[['richness']],e:'Information richness.'},
{id:'2f3',l:2,t:'fill',q:'Selling the same goods to different targeted groups at different prices is called {{0}}.',b:[['price discrimination']],e:'Price discrimination.'},
{id:'2f4',l:2,t:'fill',q:'Ubiquity creates a {{0}}: a marketplace extended beyond traditional boundaries.',b:[['marketspace','market space']],e:'Marketspace.'},
{id:'2f5',l:2,t:'fill',q:'Social technology provides a {{0}} model of mass communications.',b:[['many-to-many','many to many']],e:'Many-to-many.'},
{id:'2f6',l:2,t:'fill',q:'{{0}} transparency refers to the ability of consumers to discover the actual costs merchants pay for products.',b:[['cost']],e:'Cost transparency.'},
{id:'2l1',l:2,t:'list',q:'List the eight unique features of e-commerce technology.',n:8,items:[{s:'Ubiquity',k:['ubiquit','ubiqu']},{s:'Global reach',k:['global']},{s:'Universal standards',k:['universal','standard']},{s:'Information richness',k:['rich']},{s:'Interactivity',k:['interactiv']},{s:'Information density',k:['densit','dense']},{s:'Personalization and customization',k:['personali','customi']},{s:'Social technology',k:['social']}],e:'Ugly Goats Use III-Phones, Please Smile.'},
{id:'2l2',l:2,t:'list',q:'List the three business consequences of growing information density.',n:3,items:[{s:'Price transparency',k:['price transparen']},{s:'Cost transparency',k:['cost transparen']},{s:'Price discrimination',k:['discrimin']}],e:'From the information density slide.'},
{id:'2l3',l:2,t:'list',q:'List five examples of interactivity.',n:5,items:[{s:'Comment features',k:['comment']},{s:'Community forums',k:['forum']},{s:'Social networks with like and share buttons',k:['like','share','social network']},{s:'Forms that notify the user of a problem while being filled out',k:['form']},{s:'Search boxes that autofill as the user types',k:['autofill','auto fill','search','autocomplete']}],e:'From the interactivity slide.'},
{id:'2l4',l:2,t:'list',q:'List three examples of price discrimination.',n:3,items:[{s:'Issuing coupons',k:['coupon']},{s:'Specific discounts (e.g. age discounts)',k:['discount','age']},{s:'Loyalty programs',k:['loyal']}],e:'From the price discrimination slide.'},
{id:'2x1',l:2,t:'exp',q:'Discuss ubiquity in detail.',pts:[{p:'Available just about everywhere, at all times',k:['everywhere','all times','anytime','any time']},{p:'Shop from desktop, home, work, or car',k:['home','work','car','desktop']},{p:'Traditional marketplace = physical place you visit',k:['physical','visit','marketplace']},{p:'Creates a marketspace removed from a temporal and geographic location',k:['marketspace','market space','temporal','geographic']},{p:'Significance: convenience up, shopping costs down',k:['convenien','cost']}],m:'Ubiquity means e-commerce is available just about everywhere, at all times. You can shop from your desktop, at home, at work, or even from your car. In traditional commerce a marketplace is a physical place you visit to transact. E-commerce creates a marketspace: a marketplace extended beyond traditional boundaries and removed from a temporal and geographic location. Customer convenience is enhanced and shopping costs are reduced.'},
{id:'2x2',l:2,t:'exp',q:'Explain information density and its three business consequences.',pts:[{p:'Total amount and quality of information available to all market participants',k:['amount','quality','all market','participants']},{p:'Price transparency: easy to find the variety of prices',k:['price transparen']},{p:'Cost transparency: discover merchants\' actual costs',k:['cost transparen']},{p:'Price discrimination: same goods, different prices for different groups',k:['discrimin']}],m:'Information density is the total amount and quality of information available to all market participants; e-commerce vastly increases it. Consequences: (1) price transparency: the ease of finding the variety of prices in a market; (2) cost transparency: consumers can discover the actual costs merchants pay; (3) price discrimination: selling the same goods to different targeted groups at different prices to maximize sales and profits.'},
{id:'2x3',l:2,t:'exp',q:'Explain price discrimination using the airline industry example.',pts:[{p:'Charging different prices for the same product based on what the customer will agree to',k:['different price','same product','agree']},{p:'Tickets bought months in advance are cheaper than last-minute',k:['advance','last minute','last-minute','early']},{p:'High demand → prices rise; low sales → prices fall',k:['demand','raise','reduce']},{p:'Late-Sunday flights cost more than early-Sunday flights',k:['sunday']}],m:'Price discrimination is a selling strategy that charges customers different prices for the same product or service, based on what the seller thinks they can get the customer to agree to. In the airline industry: tickets bought several months in advance are cheaper than last-minute tickets; when demand for a flight is high prices go up, and when a flight is not selling prices go down; flights home late on Sunday are more expensive than early-Sunday-morning flights.'},
{id:'2x4',l:2,t:'exp',q:'What is the difference between personalization and customization? Give an example of each.',pts:[{p:'Personalization targets marketing messages (name, interests, past purchases)',k:['message','name','interest','past purchase']},{p:'Personalization example: product recommendations ("customers also buy")',k:['recommend','also buy','also bought']},{p:'Customization changes the delivered product or service based on preferences',k:['product','service','preference']},{p:'Customization example: custom T-shirts, bags, furniture',k:['shirt','bag','furniture','carpet','table']}],m:'Personalization is the targeting of marketing messages to specific individuals by adjusting the message to a person\'s name, interests, and past purchases, e.g. "customers also buy" product recommendations. Customization is changing the delivered product or service based on a user\'s preferences or prior behavior, e.g. customized T-shirts and bags, or furniture such as carpets and tables.'},
{id:'2x5',l:2,t:'exp',q:'How does the ubiquity of e-commerce impact consumers?',pts:[{p:'Shop anywhere, at any time',k:['anywhere','any time','anytime','everywhere']},{p:'No need to travel to a physical marketplace',k:['travel','physical','visit']},{p:'Marketspace removed from time and place',k:['marketspace','temporal','geographic']},{p:'Convenience increases and shopping costs fall',k:['convenien','cost']}],m:'Ubiquity means consumers can shop just about everywhere, at all times (at home, at work, even from the car) instead of travelling to a physical marketplace. This creates a marketspace removed from a temporal and geographic location, which enhances customer convenience and reduces shopping costs.'},
{id:'2p1',l:2,t:'match',q:'Match each unique feature with its business significance.',n:4,pairs:[['Ubiquity','Shopping can take place anywhere; convenience up, shopping costs down'],['Global reach','Billions of consumers and millions of businesses worldwide'],['Universal standards','A common, inexpensive, global technology foundation'],['Richness','Video, audio and text integrated into one marketing message'],['Interactivity','Consumer becomes a co-participant in delivering goods'],['Information density','Information becomes plentiful, cheap and accurate'],['Personalization/customization','Personalized messages and customized products'],['Social technology','User content creation and social networks']],e:'Table 1.2.'},
{id:'2p2',l:2,t:'match',q:'Match each term with its meaning.',n:4,pairs:[['Price transparency','Ease of finding the variety of prices in a market'],['Cost transparency','Discovering the actual costs merchants pay'],['Price discrimination','Same goods, different prices for different groups'],['Personalization','Adjusting the message to a person\'s name and interests'],['Customization','Changing the product based on user preferences'],['Marketspace','Marketplace removed from a temporal and geographic location']],e:'Lecture 2 terms.'},

/* ===================== LECTURE 3 ===================== */
{id:'3m1',l:3,t:'mcq',q:'Types of e-commerce are distinguished by…',o:['the nature of the market relationship: who is selling to whom','the size of the company','the country where the company is based','the programming language of the website'],e:'Who is selling to whom.'},
{id:'3m2',l:3,t:'mcq',q:'Which is the LARGEST form of e-commerce?',o:['B2B','B2C','C2C','M-commerce'],e:'B2B is the largest. B2C is the one most consumers encounter.'},
{id:'3m3',l:3,t:'mcq',q:'Which type of e-commerce are most consumers likely to encounter?',o:['B2C','B2B','C2C','Social e-commerce'],e:'B2C.'},
{id:'3m4',l:3,t:'mcq',q:'Metalshub, an independent third-party marketplace serving the metals industry, is an example of…',o:['B2B','B2C','C2C','M-commerce'],e:'B2B example.'},
{id:'3m5',l:3,t:'mcq',q:'Etsy, where people make, sell, buy and collect handmade items, is an example of…',o:['C2C','B2B','B2C','Social e-commerce'],e:'C2C example (with eBay).'},
{id:'3m6',l:3,t:'mcq',q:'H&M, a Swedish fast-fashion clothing company, is a slide example of…',o:['B2C','B2B','C2C','M-commerce'],e:'B2C examples: Amazon, Walmart, H&M.'},
{id:'3m7',l:3,t:'mcq',q:'In C2C e-commerce, the market maker provides…',o:['catalog, search engine and transaction clearing','the products being sold','manufacturing and packaging','bank loans to sellers'],e:'The consumer prepares the product; the market maker provides catalog, search, and transaction clearing.'},
{id:'3m8',l:3,t:'mcq',q:'Social e-commerce is e-commerce enabled by…',o:['social networks and online social relationships','wireless digital devices','wholesalers and distributors','government portals'],e:'Example: Facebook, Instagram.'},
{id:'3m9',l:3,t:'mcq',q:'Total social commerce revenues worldwide in 2020 were estimated at around…',o:['$90 billion','$9 billion','$900 billion','$9 trillion'],e:'Around $90 billion (Business Wire, 2020).'},
{id:'3m10',l:3,t:'mcq',q:'M-commerce involves…',o:['the use of wireless digital devices to enable online transactions','businesses selling to businesses','consumers selling to consumers','selling through physical stores'],e:'Mobile e-commerce: smartphones and tablets.'},
{id:'3m11',l:3,t:'mcq',q:'Mobile and social e-commerce can be looked at as…',o:['subsets of the other types of e-commerce','the largest types of e-commerce','types of e-business','the same thing as B2B'],e:'Slide: "Mobile and social e-commerce can be looked at as subsets of these types."'},
{id:'3m12',l:3,t:'mcq',q:'In the B2B model, who orders products in bulk from the business organization\'s website?',o:['The wholesaler','The final consumer','The government','The market maker'],e:'Wholesaler orders → business processes and supplies → wholesaler sells to customers at a higher price.'},
{id:'3m13',l:3,t:'mcq',q:'Which is a benefit of e-commerce to ORGANIZATIONS?',o:['Mass customization','Price comparisons','More choices','An environment of competition'],e:'Organizations: international marketplace, operational cost saving, mass customization, no time constraints.'},
{id:'3m14',l:3,t:'mcq',q:'Which is a benefit of e-commerce to CONSUMERS?',o:['Price comparisons','Operational cost saving','International marketplace','Mass customization'],e:'Consumers: 24/7 access, more choices, price comparisons, improved delivery, competition.'},
{id:'3m15',l:3,t:'mcq',q:'"Operational cost saving" means a lower cost of…',o:['creating, processing, distributing, storing and retrieving paper-based information','hiring and training staff','building physical stores','paying taxes'],e:'Benefit to organizations.'},
{id:'3m16',l:3,t:'mcq',q:'The primary societal issues in e-commerce are…',o:['intellectual property and individual privacy','shipping costs and delivery time','website speed and design','stock prices and profits'],e:'The Society theme.'},
{id:'3m17',l:3,t:'mcq',q:'TCP/IP, web servers, HTML and databases belong to which theme?',o:['Technology','Business','Society','Evolution'],e:'Technology theme.'},
{id:'3m18',l:3,t:'mcq',q:'Electronic markets, business models, industry structure and consumer behaviour belong to which theme?',o:['Business','Technology','Society','Invention'],e:'Business theme.'},
{id:'3m19',l:3,t:'mcq',q:'The Invention stage of e-commerce lasted from…',o:['1995–2000','2001–2006','2007–present','1990–1995'],e:'Invention 1995–2000 · Consolidation 2001–2006 · Reinvention 2007–present.'},
{id:'3m20',l:3,t:'mcq',q:'Which stage ended with the "dot-com crash"?',o:['Invention','Consolidation','Reinvention','Globalization'],e:'2000: stock valuations plunged and thousands of companies disappeared.'},
{id:'3m21',l:3,t:'mcq',q:'In which stage did the emphasis shift from "technology-driven" to "business-driven"?',o:['Consolidation','Invention','Reinvention','Disintermediation'],e:'Consolidation, 2001–2006.'},
{id:'3m22',l:3,t:'mcq',q:'The emergence of the mobile digital platform, social networks and Web 2.0 started which stage?',o:['Reinvention','Consolidation','Invention','Integration'],e:'Reinvention began in 2007.'},
{id:'3m23',l:3,t:'mcq',q:'On-demand personal service businesses such as Uber and Careem belong to which stage?',o:['Reinvention','Invention','Consolidation','None of them'],e:'Reinvention (2007–present).'},
{id:'3m24',l:3,t:'mcq',q:'Disintermediation is…',o:['the displacement of market middlemen by a direct relationship between producers and consumers','the growth of wholesalers online','adding more intermediaries to a market','merging two companies'],e:'Middlemen are replaced by a direct producer–consumer relationship.'},
{id:'3m25',l:3,t:'mcq',q:'"First movers" are…',o:['firms first to market in an area that moved quickly to gather market share','firms that copy competitors','the first customers to buy online','wholesalers that move goods first'],e:'Invention-period belief: extraordinary profits would go to first movers.'},
{id:'3m26',l:3,t:'mcq',q:'Market middlemen are…',o:['distributors and wholesalers between producers and consumers','software developers','online customers','government regulators'],e:'Each demands a payment and raises costs while adding little value.'},
{id:'3m27',l:3,t:'mcq',q:'The Consolidation period was enabled by…',o:['broadband networks and cheaper, more powerful personal computers','smartphones and social networks','Web 2.0 applications','on-demand service apps'],e:'Smartphones, social networks and Web 2.0 belong to Reinvention.'},
{id:'3m28',l:3,t:'mcq',q:'During the Invention period, e-commerce meant selling…',o:['retail goods, usually quite simple goods','complex travel and financial services','on-demand personal services','only digital downloads'],e:'Complex services (travel, finance) came in Consolidation.'},
{id:'3m29',l:3,t:'mcq',q:'"Improved delivery processes" as a consumer benefit includes…',o:['immediate download of digital goods and online package tracking','free shipping on every order','delivery by drone only','paper-based receipts'],e:'Benefit to consumers.'},
{id:'3t1',l:3,t:'tf',q:'B2C is the largest form of e-commerce.',a:false,e:'False. B2B is the largest.'},
{id:'3t2',l:3,t:'tf',q:'eBay facilitates consumer-to-consumer (C2C) sales through its website.',a:true,e:'True.'},
{id:'3t3',l:3,t:'tf',q:'Walmart is a slide example of C2C e-commerce.',a:false,e:'False. Walmart is a B2C example.'},
{id:'3t4',l:3,t:'tf',q:'During consolidation, brand extension and strengthening became more important than creating new brands.',a:true,e:'True.'},
{id:'3t5',l:3,t:'tf',q:'The Reinvention period began in 2001.',a:false,e:'False. Reinvention began in 2007; Consolidation began in 2001.'},
{id:'3t6',l:3,t:'tf',q:'During consolidation, e-commerce was growing again by more than 10% a year.',a:true,e:'True.'},
{id:'3t7',l:3,t:'tf',q:'Facebook is both the leading social network and a social e-commerce site.',a:true,e:'True.'},
{id:'3t8',l:3,t:'tf',q:'"No time constraints" is a benefit of e-commerce to organizations.',a:true,e:'True. Businesses can be contacted at any time.'},
{id:'3t9',l:3,t:'tf',q:'The early years of e-commerce (Invention) were a technological failure.',a:false,e:'False. They were a technological success; the business side crashed in 2000.'},

{id:'3f2',l:3,t:'fill',q:'E-commerce has gone through three stages: {{0}}, {{1}} and {{2}}.',b:[['invention'],['consolidation'],['reinvention']],e:'In order: invention, consolidation, reinvention.'},
{id:'3f3',l:3,t:'fill',q:'{{0}} is the displacement of market middlemen by a new direct relationship between producers and consumers.',b:[['disintermediation']],e:'Disintermediation.'},
