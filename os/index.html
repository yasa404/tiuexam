  <script>
    /* iPhone/iPad Safari zooms in when you tap a text box with small text (A4 pages are
       scaled down, so their boxes always are). maximum-scale=1 stops that focus zoom;
       iOS still allows pinch-zoom, so nothing is lost. Other browsers are left alone. */
    (function () {
      var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var vp = document.querySelector('meta[name=viewport]');
      if (ios && vp) vp.setAttribute('content', vp.getAttribute('content') + ', maximum-scale=1');
    })();
  </script>
  <script>
    /* Apply the saved theme before first paint (no white flash in dark mode).
       os327.theme = 'auto' | 'light' | 'dark'; data-mode is the resolved light/dark. */
    (function () {
      var t = 'auto';
      try { t = localStorage.getItem('os327.theme') || 'auto'; } catch (e) { /* storage blocked */ }
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
    })();
  </script>
